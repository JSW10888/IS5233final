apiVersion: v1
kind: ConfigMap
metadata:
  name: blackbox-config
  namespace: task-dev
data:
  blackbox.yml: |
    modules:
      http_2xx:
        prober: http
        timeout: 5s
        http:
          preferred_ip_protocol: ip4
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blackbox
  namespace: task-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blackbox
  template:
    metadata:
      labels:
        app: blackbox
    spec:
      containers:
        - name: blackbox
          image: prom/blackbox-exporter:v0.27.0
          args: ["--config.file=/config/blackbox.yml"]
          ports:
            - containerPort: 9115
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: blackbox-config
---
apiVersion: v1
kind: Service
metadata:
  name: blackbox
  namespace: task-dev
spec:
  selector:
    app: blackbox
  ports:
    - port: 9115
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: task-dev
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    rule_files:
      - /etc/prometheus/alerts.yml
    scrape_configs:
      - job_name: task-api-probe
        metrics_path: /probe
        params:
          module: [http_2xx]
        static_configs:
          - targets:
              - http://task-api.task-dev.svc.cluster.local:8000/ready
            labels:
              purpose: application
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: blackbox:9115
      - job_name: synthetic-failure
        metrics_path: /probe
        params:
          module: [http_2xx]
        static_configs:
          - targets:
              - http://127.0.0.1:1/
            labels:
              purpose: synthetic-test
        relabel_configs:
          - source_labels: [__address__]
            target_label: __param_target
          - source_labels: [__param_target]
            target_label: instance
          - target_label: __address__
            replacement: blackbox:9115
  alerts.yml: |
    groups:
      - name: task-reliability
        rules:
          - alert: TaskApiUnavailable
            expr: probe_success{job="task-api-probe"} == 0
            for: 30s
            labels:
              severity: critical
              purpose: application
            annotations:
              summary: Task API readiness endpoint is unavailable
              description: Inspect task-api pods, database connectivity, and recent Git changes.
          - alert: SyntheticProbeFailureDemo
            expr: probe_success{job="synthetic-failure"} == 0
            for: 30s
            labels:
              severity: info
              purpose: synthetic-test
            annotations:
              summary: Intentional synthetic failure for alert demonstration
              description: This target is deliberately unreachable. It does not indicate an application outage.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: task-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=2d
          ports:
            - containerPort: 9090
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /prometheus
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: task-dev
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: task-dev
data:
  datasource.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: task-dashboard
        type: file
        options:
          path: /var/lib/grafana/dashboards
  task-dashboard.json: |
    {
      "uid": "task-reliability",
      "title": "Task Manager Reliability - Local Demonstration",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "15s",
      "time": {"from": "now-15m", "to": "now"},
      "panels": [
        {
          "id": 1, "type": "stat", "title": "API readiness (1 = healthy, 0 = failed)",
          "gridPos": {"h": 6, "w": 12, "x": 0, "y": 0},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "probe_success{job=\"task-api-probe\"}", "instant": true}],
          "fieldConfig": {"defaults": {"min": 0, "max": 1, "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}}}
        },
        {
          "id": 2, "type": "timeseries", "title": "API readiness probe history",
          "gridPos": {"h": 6, "w": 12, "x": 12, "y": 0},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "probe_success{job=\"task-api-probe\"}", "legendFormat": "API readiness"}],
          "fieldConfig": {"defaults": {"min": 0, "max": 1}}
        },
        {
          "id": 3, "type": "table", "title": "Firing alerts - synthetic-test is intentional",
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 6},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "ALERTS{alertstate=\"firing\"}", "instant": true, "format": "table"}]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: task-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:12.1.1
          ports:
            - containerPort: 3000
          env:
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Viewer
            - name: GF_AUTH_DISABLE_LOGIN_FORM
              value: "true"
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
          volumeMounts:
            - name: provisioning
              mountPath: /etc/grafana/provisioning/datasources/datasource.yml
              subPath: datasource.yml
              readOnly: true
            - name: provisioning
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yml
              subPath: dashboards.yml
              readOnly: true
            - name: provisioning
              mountPath: /var/lib/grafana/dashboards/task-dashboard.json
              subPath: task-dashboard.json
              readOnly: true
      volumes:
        - name: provisioning
          configMap:
            name: grafana-provisioning
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: task-dev
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
