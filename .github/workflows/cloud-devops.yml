name: Test Build and Propose Deployment

on:
  pull_request:
  push:
    branches: [main, master]
    paths:
      - 'app/**'
      - 'tests/**'
      - 'migrations/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'requirements-dev.txt'
      - 'pytest.ini'
      - '.github/workflows/cloud-devops.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_NAME: taskdb_test
      DB_USER: taskadmin
      TASK_DB_PASSWORD: ci-only-password
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: taskdb_test
          POSTGRES_USER: taskadmin
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskadmin -d taskdb_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Create test schema
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import psycopg
          with psycopg.connect(
              host=os.environ['DB_HOST'],
              port=os.environ['DB_PORT'],
              dbname=os.environ['DB_NAME'],
              user=os.environ['DB_USER'],
              password=os.environ['TASK_DB_PASSWORD'],
          ) as conn:
              conn.execute(Path('migrations/001_create_tasks.sql').read_text())
          PY
      - name: Run API and database tests
        run: python -m pytest -v --junitxml=test-results.xml
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Authenticate to Artifact Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: us-central1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ secrets.GCP_ACCESS_TOKEN }}
      - name: Build and publish tested application
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: us-central1-docker.pkg.dev/is5233-final/is5233-app/task-manager:run-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Pull exact published digest for scanning
        if: github.event_name != 'pull_request'
        env:
          IMAGE_REF: us-central1-docker.pkg.dev/is5233-final/is5233-app/task-manager@${{ steps.image.outputs.digest }}
        run: docker pull "$IMAGE_REF"
      - name: Scan published image with Grype
        if: github.event_name != 'pull_request'
        uses: anchore/scan-action@f6601287cdb1efc985d6b765bbf99cb4c0ac29d8 # v7.0.0
        with:
          image: us-central1-docker.pkg.dev/is5233-final/is5233-app/task-manager@${{ steps.image.outputs.digest }}
          output-format: json
          output-file: vulnerability-report.json
          fail-build: false
          only-fixed: false
      - name: Retain full release vulnerability report
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: release-vulnerability-report
          path: vulnerability-report.json
          if-no-files-found: error
      - name: Block unsafe promotion
        if: github.event_name != 'pull_request'
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          report = json.loads(Path('vulnerability-report.json').read_text())
          if not isinstance(report.get('matches'), list) or not isinstance(report.get('source'), dict):
              raise SystemExit('Invalid scanner report; refusing promotion.')
          counts = Counter()
          blocked = []
          review = []
          for match in report['matches']:
              vulnerability = match['vulnerability']
              severity = vulnerability['severity'].lower()
              fixed_versions = (vulnerability.get('fix') or {}).get('versions') or []
              counts[severity] += 1
              finding = f"{vulnerability['id']} / {match['artifact']['name']} / {severity} / fixes={fixed_versions}"
              if severity == 'critical' or (severity == 'high' and fixed_versions):
                  blocked.append(finding)
              elif severity == 'high':
                  review.append(finding)
          print('All-match counts:', dict(counts))
          for finding in review:
              print('MANUAL RISK REVIEW - unfixed high:', finding)
          for finding in blocked:
              print('BLOCKED:', finding)
          if blocked:
              raise SystemExit('Promotion blocked: critical or fixable high vulnerabilities detected.')
          print('Security gate passed. Review remaining findings; this is not proof of a vulnerability-free image.')
          PY
      - name: Save deployment image reference
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          echo "us-central1-docker.pkg.dev/is5233-final/is5233-app/task-manager@$DIGEST" > image-reference.txt
      - name: Upload deployment reference
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: deployment-image
          path: image-reference.txt

  propose-deployment:
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: deployment-image
          path: release
      - name: Update GitOps image digest
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          image = Path('release/image-reference.txt').read_text().strip()
          path = Path('kubernetes-dev.yaml')
          text = path.read_text()
          text, count = re.subn(
              r'(?m)^(\s*image:\s*)us-central1-docker\.pkg\.dev/is5233-final/is5233-app/task-manager[^\s]*[ \t]*$',
              lambda match: match.group(1) + image,
              text,
          )
          if count != 1:
              raise SystemExit(f'Expected one application image, found {count}')
          path.write_text(text)
          PY
      - name: Propose reviewed dev promotion
        uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/promote-dev
          base: ${{ github.event.repository.default_branch }}
          add-paths: kubernetes-dev.yaml
          commit-message: Promote tested application image to dev
          title: Promote tested application image to dev
          body: |
            Updates dev to the immutable image digest built after passing API/PostgreSQL tests and the release vulnerability gate. Review the complete scan artifact and any unfixed high findings before merging.
            Review and merge to trigger Argo CD synchronization. Confirm the registry pull credential is current before promotion.
          delete-branch: true

